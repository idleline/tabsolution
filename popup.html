<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tabsolution</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header><div class="mark">T</div><div><h1>Tabsolution</h1><p>A familiar name for every tab.</p></div></header>
<form id="rule-form">
<label for="tab-name">Tab name</label><input id="tab-name" placeholder="e.g. Salesforce · Production" maxlength="200" required autofocus>
<fieldset><legend>Match using</legend><label><input type="radio" name="type" value="exact" checked> Exact URL</label><label><input type="radio" name="type" value="regex"> Regex pattern</label></fieldset>
<div id="exact-field"><label for="url">URL</label><input id="url" type="url"><p class="hint">Matches the full URL, including query and fragment.</p></div>
<div id="regex-field" hidden><label for="pattern">URL regex pattern</label><input id="pattern" placeholder="(.+)\.mce\.salesforce\.[a-z]{2,3}" spellcheck="false"><p class="hint">JavaScript regex, without / delimiters. Tested against the full URL.</p><p id="match-preview" class="hint"></p></div>
<p id="status" role="status" aria-live="polite"></p>
<div class="actions"><button type="button" id="cancel" class="secondary">Cancel</button><button id="save" type="submit">Save name</button></div>
</form>
<section><div class="section-heading"><h2>Saved rules</h2><button id="new-rule" type="button" class="text-button">New rule</button></div><p class="hint">Exact URLs win. Otherwise, the first matching pattern wins.</p><ul id="rules"></ul></section>
<footer>Stored only in this Chrome profile.</footer>
<script src="rules.js"></script><script src="popup.js"></script>
</body></html>
